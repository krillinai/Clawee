server:
  addr: "0.0.0.0:1904"

database:
  url: "postgres://claw_gateway@localhost:15932/claw_gateway?sslmode=disable"

security:
  session_cookie_name: "claw_front_token"
  admin_session_cookie_name: "claw_admin_token"
  session_cookie_secure: false
  # Clawee 客户端按用户操作自动续期，连续闲置超过此期限需重新登录；管理台会话仍为固定有效期。
  session_duration: "168h"
  user_jwt_signing_key: ""
  agent_token_encryption_key: ""

logging:
  level: "info"
  format: "console"
  output: "stdout"
  access_enabled: true
  error_response_body: false

static:
  dir: ""

office:
  install:
    public_base_url: ""
    collector_binary_root: "public/collectors"

mcp:
  public_base_url: "http://localhost:1904"
  auth:
    enabled: true
    resource: "http://localhost:1904/mcp"
    resource_metadata_url: "http://localhost:1904/.well-known/oauth-protected-resource/mcp"
    authorization_servers: []
    required_scopes:
      - "mcp:call"

knowledge:
  enabled: false
  provider_type: "bailian"
  bailian:
    endpoint: "https://bailian.cn-beijing.aliyuncs.com"
    workspace_id: ""
    access_key_id: ""
    access_key_secret: ""
  # 启用 RAGFlow 时设置 provider_type: ragflow；宿主机直连可用 http://127.0.0.1:18080。
  # 真实 Key 只放在仓库外 .env 或环境变量中。
  ragflow:
    base_url: ""
    api_key_ref: "RAGFLOW_API_KEY"
    embedding_model: ""
    rerank_id: ""

skillhub:
  enabled: false
  # 唯一审核 Agent 的稳定 ID；也可通过 CLAW_GATEWAY_SKILL_REVIEW_AGENT_ID 设置。
  review_agent_id: ""
  package_root: "data/skillhub/packages"
  github_sync_enabled: false
  repository_root: "data/skillhub/repositories"

shared_files:
  storage_root: "data/shared-files"
  oss:
    # 仅填写由部署者审核过的自定义 OSS CNAME；官方 aliyuncs.com Endpoint 无需配置。
    allowed_endpoint_hosts: []

claw_admin:
  base_url: ""
  deployment_credential: ""
  timeout: "10s"

model_access:
  mode: "enterprise_managed"

agent_activity:
  reporting_enabled: false

feedback:
  # 本部署反馈中心：客户端异常、手工反馈与管理台反馈均在本部署保存，不转发维护方。
  enabled: false
  # 是否展示管理台的问题反馈菜单和页面；开启后仍需对应权限和数据授权。
  admin_ui_enabled: false

sub2api:
  base_url: ""
  admin_api_key: ""
  organization_user_id: 0

dingtalk:
  oa_enabled: false
  oa_event_token: ""
  oa_encoding_aes_key: ""
  enabled: false
  client_id: ""
  client_secret: ""
  redirect_url: ""
  provider_key: "default"
  employee_source: "dingtalk"
  auto_provision: false
  state_ttl: "10m"
  request_timeout: "10s"

bilibili:
  enabled: false
  client_id: ""
  client_secret: ""
  redirect_url: ""
