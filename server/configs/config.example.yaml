server:
  addr: "0.0.0.0:1904"

database:
  url: "postgres://claw_mcp@localhost:15932/claw_mcp?sslmode=disable"

security:
  session_cookie_name: "claw_front_token"
  admin_session_cookie_name: "claw_admin_token"
  session_cookie_secure: false
  session_duration: "168h"
  user_jwt_signing_key: ""
  agent_token_encryption_key: ""

logging:
  level: "info"
  format: "console"
  output: "stdout"
  access_enabled: true
  error_response_body: false

static:
  dir: ""

# 以下内容会匿名公开；仅填写本 Gateway 的下载信息，不放置任何凭据。
client_downloads:
  gateway: "" # 留空使用下载页 origin；分域部署必须明确填写 HTTPS origin。
  standard:
    url: "https://github.com/krillinai/Clawee/releases/latest"
    # 替换为标准安装包镜像时，必须同时填写 version 和 sha256。
  packages: []
  # packages:
  #   - platform: "macos" # macos / windows
  #     arch: "arm64" # macos 支持 arm64 / x64，windows 仅支持 x64
  #     version: "0.1.7"
  #     url: "https://downloads.example.com/demo/0.1.7/完整提交SHA/macos/arm64/Clawee.dmg"
  #     sha256: "填写实际安装包的64位SHA256"
  #     signature: "signed_notarized" # macOS: signed_notarized / unsigned；Windows: signed / unsigned

office:
  install:
    public_base_url: ""
    collector_binary_root: "public/collectors"

mcp:
  public_base_url: "http://localhost:1904"
  auth:
    enabled: true
    resource: "http://localhost:1904/mcp"
    resource_metadata_url: "http://localhost:1904/.well-known/oauth-protected-resource/mcp"
    authorization_servers: []
    required_scopes:
      - "mcp:call"

knowledge:
  enabled: false
  provider_type: "bailian"
  bailian:
    endpoint: "https://bailian.cn-beijing.aliyuncs.com"
    workspace_id: ""
    access_key_id: ""
    access_key_secret: ""

skillhub:
  enabled: false
  package_root: "data/skillhub/packages"
  github_sync_enabled: false
  repository_root: "data/skillhub/repositories"

shared_files:
  storage_root: "data/shared-files"
  oss:
    # 仅填写由部署者审核过的自定义 OSS CNAME；官方 aliyuncs.com Endpoint 无需配置。
    allowed_endpoint_hosts: []

claw_admin:
  base_url: ""
  deployment_credential: ""
  timeout: "10s"

model_access:
  mode: "enterprise_managed"

agent_activity:
  reporting_enabled: false

sub2api:
  base_url: ""
  admin_api_key: ""
  organization_user_id: 0

dingtalk:
  enabled: false
  client_id: ""
  client_secret: ""
  redirect_url: ""
  provider_key: "default"
  auto_provision: false
  state_ttl: "10m"
  request_timeout: "10s"

bilibili:
  enabled: false
  client_id: ""
  client_secret: ""
  redirect_url: ""
