name: clawee-development

services:
  postgres:
    image: postgres:16
    container_name: clawee-postgres
    restart: always
    environment:
      POSTGRES_DB: claw_mcp
      POSTGRES_USER: claw_mcp
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:15932:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claw_mcp -d claw_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
    name: clawee-postgres-data
