name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  statuses: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: release
        name: 验证统一版本和标签
        run: >-
          node scripts/release-version.mjs check
          --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
      - name: 验证同提交 Release Preflight
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          target_sha="$(git rev-parse HEAD)"
          state="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${target_sha}/status" \
              --jq '[.statuses[] | select(.context == "release-preflight")][0].state // "missing"'
          )"
          if [[ "$state" != 'success' ]]; then
            echo "::error::Commit ${target_sha} 的 Release Preflight 状态为 ${state}，禁止正式发布。"
            exit 1
          fi
      - name: 验证 macOS 正式签名凭据
        shell: bash
        run: |
          missing=()
          for name in \
            MACOS_CERTIFICATE \
            MACOS_CERTIFICATE_PASSWORD \
            APPLE_ID \
            APPLE_APP_SPECIFIC_PASSWORD \
            APPLE_TEAM_ID
          do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "::error::release Environment 缺少 macOS 签名 Secret：${missing[*]}"
            exit 1
          fi

  desktop:
    needs: gate
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-x64
            os: macos-15-intel
            platform: mac
            arch: x64
          - name: macos-arm64
            os: macos-14
            platform: mac
            arch: arm64
          - name: windows-x64-unsigned
            os: windows-latest
            platform: win
            arch: x64
    runs-on: ${{ matrix.os }}
    environment: release
    env:
      CLAWEE_DESKTOP_CACHE_DIR: ${{ github.workspace }}/client/apps/desktop/.cache
      CLAWEE_DESKTOP_TARGET_PLATFORM: ${{ matrix.platform }}
      CLAWEE_DESKTOP_TARGET_ARCH: ${{ matrix.arch }}
      CLAWEE_DESKTOP_BUILD_MANIFEST: ${{ github.workspace }}/client/apps/desktop/release/clawee-desktop-build-manifest-${{ matrix.platform }}-${{ matrix.arch }}.json
      CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE || '' }}
      CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MACOS_CERTIFICATE_PASSWORD || '' }}
      APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      CLAWEE_APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
      CLAWEE_OFFICIAL_RELEASE: ${{ needs.gate.outputs.prerelease == 'false' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: client/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: |
            client/apps/desktop/.cache/electron
            client/apps/desktop/.cache/electron-builder
            client/apps/desktop/.cache/node-gyp
            client/apps/desktop/.cache/npm
            client/apps/desktop/.cache/codex-runtime
          key: desktop-build-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('client/pnpm-lock.yaml', 'client/apps/desktop/package.json', 'client/config/codex-runtime.json') }}
          restore-keys: |
            desktop-build-${{ runner.os }}-${{ matrix.arch }}-
      - name: 生成 macOS 正式签名安装包
        if: matrix.platform == 'mac'
        run: pnpm desktop:release
      - name: 生成 Windows 未签名安装包
        if: matrix.platform == 'win'
        run: pnpm desktop:dist
      - name: 验证包内 Codex Runtime E2E
        run: pnpm --filter @clawee/desktop e2e:embedded-runtime
      - name: 验证包内 Codex 真实会话
        env:
          CLAWEE_RUN_REAL_CODEX_SMOKE: '1'
        run: pnpm --filter @clawee/desktop e2e:real-codex
      - name: 上传 Runtime E2E 证据
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clawee-desktop-runtime-e2e-${{ matrix.name }}
          path: |
            client/test-results/clawee-desktop-embedded-runtime-e2e.json
            client/test-results/clawee-desktop-runtime-tool-loop-e2e.json
            client/test-results/clawee-desktop-real-codex-smoke.json
            client/test-results/desktop-embedded-runtime-playwright
            client/test-results/desktop-embedded-runtime-playwright-report
            client/test-results/desktop-real-codex-playwright
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: clawee-desktop-release-${{ matrix.name }}
          path: |
            client/apps/desktop/release/*.dmg
            client/apps/desktop/release/*.exe
            client/apps/desktop/release/clawee-desktop-build-manifest-*.json
            client/apps/desktop/release/*.zip
            client/apps/desktop/release/*.blockmap
            client/apps/desktop/release/latest*.yml
          if-no-files-found: error
          retention-days: 14
    defaults:
      run:
        working-directory: client

  server:
    needs: gate
    uses: ./.github/workflows/server-release.yml
    permissions:
      contents: read

  image:
    needs: [gate, desktop, server]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            CLAW_MCP_VERSION=${{ needs.gate.outputs.version }}
            CLAW_MCP_COMMIT=${{ github.sha }}
          tags: ghcr.io/krillinai/clawee-server:sha-${{ github.sha }}

  publish:
    needs: [gate, desktop, server, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/krillinai/clawee-server
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      VERSION: ${{ needs.gate.outputs.version }}
      PRERELEASE: ${{ needs.gate.outputs.prerelease }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: clawee-*-release-*
          merge-multiple: true
      - name: 生成统一发布清单
        run: |
          node scripts/build-release-manifest.mjs \
            --artifacts artifacts \
            --output artifacts \
            --version "$VERSION" \
            --tag "$TAG" \
            --commit "$GITHUB_SHA" \
            --image "$IMAGE" \
            --image-digest "$IMAGE_DIGEST"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 创建草稿 Release 并上传产物
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != 'true' ]]; then
              echo "::error::Release ${TAG} 已公开，禁止覆盖。"
              exit 1
            fi
          else
            args=(--generate-notes --draft --verify-tag)
            if [[ "$PRERELEASE" == 'true' ]]; then
              args+=(--prerelease)
            fi
            gh release create "$TAG" "${args[@]}"
          fi
          while IFS= read -r -d '' file; do
            gh release upload "$TAG" "$file" --clobber
          done < <(find artifacts -type f -print0)
      - name: 发布版本镜像标签
        shell: bash
        run: |
          tags=(--tag "${IMAGE}:${VERSION}")
          if [[ "$PRERELEASE" == 'false' ]]; then
            tags+=(--tag "${IMAGE}:latest")
          fi
          docker buildx imagetools create \
            "${tags[@]}" \
            "${IMAGE}@${IMAGE_DIGEST}"
      - name: 公开 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [[ "$PRERELEASE" == 'true' ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
