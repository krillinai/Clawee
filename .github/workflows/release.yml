name: Gateway Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的既有版本标签，不创建或移动标签
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: gateway-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: node scripts/release-version.mjs check --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"
      - id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  preflight:
    needs: target
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/release-preflight.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      version: ${{ needs.target.outputs.tag }}
      build_candidates: true
  image:
    needs: [target, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-server" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            CLAW_GATEWAY_VERSION=${{ needs.target.outputs.version }}
            CLAW_GATEWAY_COMMIT=${{ needs.target.outputs.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.image.outputs.name }}:sha-${{ needs.target.outputs.sha }}
  publish:
    needs: [target, preflight, image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.target.outputs.tag }}
      VERSION: ${{ needs.target.outputs.version }}
      PRERELEASE: ${{ needs.target.outputs.prerelease }}
      IMAGE: ${{ needs.image.outputs.name }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
      SOURCE_SHA: ${{ needs.target.outputs.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: clawee-server-release-linux-*
          merge-multiple: true
      - name: 记录镜像和源码身份
        shell: bash
        run: |
          cd artifacts
          sha256sum --check server-linux-amd64-SHA256SUMS
          sha256sum --check server-linux-arm64-SHA256SUMS
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          const { TAG, VERSION, SOURCE_SHA, IMAGE, IMAGE_DIGEST } = process.env;
          if (!/^sha256:[0-9a-f]{64}$/.test(IMAGE_DIGEST)) throw new Error('镜像摘要无效');
          writeFileSync('gateway-release.json', JSON.stringify({schemaVersion: 1, product: 'aigateway', tag: TAG, version: VERSION, commit: SOURCE_SHA, image: {name: IMAGE, digest: IMAGE_DIGEST}}, null, 2) + '\n');
          NODE
      - name: 创建并公开 Gateway Release
        shell: bash
        run: |
          args=(--draft --verify-tag --generate-notes)
          [[ "$PRERELEASE" != true ]] || args+=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            [[ "$(gh release view "$TAG" --json isDraft --jq .isDraft)" == true ]] || { echo '已公开版本不覆盖'; exit 1; }
          else
            gh release create "$TAG" "${args[@]}"
          fi
          gh release upload "$TAG" artifacts/* --clobber
          if [[ "$PRERELEASE" == true ]]; then
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release edit "$TAG" --draft=false --latest
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: 晋级已验证镜像
        shell: bash
        run: |
          tags=(--tag "${IMAGE}:${VERSION}")
          [[ "$PRERELEASE" != false ]] || tags+=(--tag "${IMAGE}:latest")
          docker buildx imagetools create "${tags[@]}" "${IMAGE}@${IMAGE_DIGEST}"
