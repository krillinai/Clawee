name: Gateway Release Preflight
on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
      version:
        type: string
        required: false
      build_candidates:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: 要验证的分支、Tag 或 Commit SHA
        type: string
        required: false
      version:
        description: Gateway 版本
        type: string
        required: false
      build_candidates:
        description: 构建服务端包并验证隔离容器
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: gateway-preflight-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.target.outputs.sha }}
      tag: ${{ steps.target.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: target
        env:
          CLAWEE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/release-version.mjs check --github-output "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  verify:
    needs: target
    uses: ./.github/workflows/server-ci.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
  packages:
    needs: [target, verify]
    if: inputs.build_candidates
    uses: ./.github/workflows/server-release.yml
    with:
      ref: ${{ needs.target.outputs.sha }}
      tag: ${{ needs.target.outputs.tag }}
  container:
    needs: [target, verify]
    if: inputs.build_candidates
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: docker build -f server/Dockerfile -t aigateway:preflight .
      - run: CLAWEE_TEST_IMAGE=aigateway:preflight node scripts/container-smoke.mjs
  record:
    if: always() && needs.target.outputs.sha != ''
    needs: [target, verify, packages, container]
    runs-on: ubuntu-latest
    permissions:
      statuses: write
    steps:
      - name: 记录 Gateway 发布预检结果
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.target.outputs.sha }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PACKAGE_RESULT: ${{ needs.packages.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
          BUILD_CANDIDATES: ${{ inputs.build_candidates }}
        shell: bash
        run: |
          expected=skipped
          [[ "$BUILD_CANDIDATES" != 'true' ]] || expected=success
          state=failure
          if [[ "$VERIFY_RESULT" == success && "$PACKAGE_RESULT" == "$expected" && "$CONTAINER_RESULT" == "$expected" ]]; then
            state=success
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" -f context=gateway-release-preflight \
            -f description="Gateway 发布预检：$state" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          [[ "$state" == success ]]
