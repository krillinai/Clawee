name: Server Release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml
      - run: pnpm --dir server/web install --frozen-lockfile
      - name: 构建版本包与校验文件
        working-directory: server
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_GOARCH: ${{ matrix.arch }}
          CLAW_MCP_COMMIT: ${{ github.sha }}
        run: |
          node ../scripts/release-version.mjs check --tag "$RELEASE_TAG"
          export CLAW_MCP_VERSION="${RELEASE_TAG#v}"
          export PACKAGE_NAME="clawee-server-${RELEASE_TAG}-linux-${TARGET_GOARCH}.tar.gz"
          ./scripts/package-release.sh
          cd release
          sha256sum "$PACKAGE_NAME" > "server-linux-${TARGET_GOARCH}-SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: clawee-server-release-linux-${{ matrix.arch }}
          path: |
            server/release/*.tar.gz
            server/release/*SHA256SUMS
          if-no-files-found: error
