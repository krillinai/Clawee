name: Server Release
on:
  workflow_call:
permissions:
  contents: read
  packages: write
jobs:
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: server/web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: server/web/pnpm-lock.yaml
      - run: pnpm --dir server/web install --frozen-lockfile
      - name: 构建版本包与校验文件
        working-directory: server
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          TARGET_GOARCH: ${{ matrix.arch }}
          CLAW_MCP_COMMIT: ${{ github.sha }}
        run: |
          test "$RELEASE_TAG" = "v$(node -p "require('../package.json').version")"
          export CLAW_MCP_VERSION="${RELEASE_TAG#v}"
          export PACKAGE_NAME="clawee-server-${RELEASE_TAG}-linux-${TARGET_GOARCH}.tar.gz"
          ./scripts/package-release.sh
          cd release
          sha256sum "$PACKAGE_NAME" > "server-linux-${TARGET_GOARCH}-SHA256SUMS"
      - uses: actions/upload-artifact@v4
        with:
          name: clawee-server-release-linux-${{ matrix.arch }}
          path: |
            server/release/*.tar.gz
            server/release/*SHA256SUMS
          if-no-files-found: error
  image:
    needs: packages
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 读取统一版本
        id: version
        run: echo "value=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: true
          sbom: true
          build-args: |
            CLAW_MCP_VERSION=${{ steps.version.outputs.value }}
            CLAW_MCP_COMMIT=${{ github.sha }}
          tags: |
            ghcr.io/krillinai/clawee-server:${{ steps.version.outputs.value }}
            ghcr.io/krillinai/clawee-server:sha-${{ github.sha }}
