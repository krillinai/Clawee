appId: com.clawee.desktop
productName: Clawee
asar: true
publish:
  provider: github
  owner: krillinai
  repo: Clawee
  channel: latest
  releaseType: release
npmRebuild: false
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  resetAdHocDarwinSignature: true
asarUnpack:
  - "**/*.node"
directories:
  output: release
files:
  - dist/main/**/*
  - dist/preload/**/*
  - dist/bootstrap/**/*
  - dist/shared/**/*
  - package.json
  - "!**/*.map"
  - "!**/*.d.ts"
  - "!**/{test,tests,__tests__,example,examples}/**/*"
extraResources:
  - from: ../../../third_party
    to: licenses/third_party
  - from: node_modules/electron/dist
    to: licenses/electron
    filter:
      - LICENSE
      - LICENSES.chromium.html
  - from: ../../..
    to: licenses/clawee
    filter:
      - LICENSE
      - NOTICE
  - from: .pack/codex-runtime
    to: codex-runtime
  - from: .pack/desktop-runtime/node_modules
    to: node_modules
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
  - from: .pack/daemon/dist
    to: daemon/dist
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
  - from: .pack/daemon/node_modules
    to: daemon/node_modules
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/{test,tests,__tests__,example,examples}/**/*"
  - from: .pack/daemon/package.json
    to: daemon/package.json
  - from: .pack/deployment
    to: deployment
  - from: ../web/dist
    to: web
  - from: resources
    to: desktop-resources
protocols:
  - name: Clawee
    schemes:
      - clawee
mac:
  category: public.app-category.developer-tools
  extendInfo:
    CFBundleDevelopmentRegion: zh_CN
    CFBundleLocalizations:
      - zh_CN
      - zh-Hans
  target:
    - dmg
    - zip
  hardenedRuntime: true
  gatekeeperAssess: false
  signIgnore:
    - ".*/Contents/Resources/codex-runtime/.*"
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  icon: resources/icon.png
  notarize: true
dmg:
  sign: true
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  artifactName: ${productName}-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
